name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pnpm test + typecheck (conformance gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # core's vitest suite includes the golden-fixture conformance tests that
      # pin the cross-platform wire format.
      - run: pnpm -r test
      - run: pnpm -r typecheck
