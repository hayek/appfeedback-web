name = "appfeedback-relay"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Public, non-secret config. Edit these for your repo.
[vars]
REPO_OWNER = "acme"
REPO_NAME = "feedback"
# Your site's origin. Set this to the site that embeds the widget. Using "*"
# (allow any origin) is convenient for a quick test but is NOT recommended for
# production — a tightened origin is the secure default shipped here.
ALLOWED_ORIGIN = "https://your-site.example.com"

# Secrets are NOT stored here. Set them once with:
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put TURNSTILE_SECRET   # optional, enables CAPTCHA
